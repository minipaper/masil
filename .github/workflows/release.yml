name: release

# v* 태그를 push하면 Windows 설치 파일을 만들어 GitHub Releases에 올린다.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # postinstall이 better-sqlite3를 Electron용으로 다시 빌드한다
      - run: npm ci
      - run: npm test
      - run: npm run build
      # 빌드만 한다. electron-builder가 직접 올리면 파일을 동시에 올리다 릴리스 생성이 겹쳐 일부가 빠진다.
      - name: 설치 파일 빌드
        run: npx electron-builder --win --publish never
      - name: 릴리스에 올리기
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd "release/$VERSION"
          ls -la
          test -f latest.yml
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$VERSION" --generate-notes
          # latest.yml은 electron-updater가 새 버전을 찾을 때 읽는다. 설치 파일과 함께 올린다.
          gh release upload "$GITHUB_REF_NAME" "Masil-Setup-$VERSION.exe" "Masil-Setup-$VERSION.exe.blockmap" latest.yml --clobber
          # 초안으로 남아 있으면 electron-updater가 보지 못하므로 공개한다
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
