# Windows 설치 파일(NSIS) 빌드 설정. 릴리스는 v* 태그를 push하면 GitHub Actions가 만든다.
appId: com.minipaper.masil
productName: 마실
copyright: Copyright © 2026 minipaper
directories:
  output: release/${version}
  buildResources: resources
files:
  - out/**
  - package.json
  - '!**/*.map'
# 아이콘, 트레이 이미지 (src/main/paths.ts의 resourcePath가 읽는다)
extraResources:
  - from: resources
    to: resources
    filter:
      - '*.png'
asarUnpack:
  - '**/*.node'
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  # 실행 파일과 설치 파일 이름은 영문으로 (업데이트 메타데이터 latest.yml이 파일명을 쓴다)
  executableName: Masil
  artifactName: Masil-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  shortcutName: 마실
  uninstallDisplayName: 마실
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: minipaper
  repo: masil
  # 초안이 아니라 바로 공개 릴리스로 올린다 (electron-updater는 공개 릴리스만 본다)
  releaseType: release
